<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カロリー">
<meta name="theme-color" content="#f8f5ef">
<title>カロリートラッカー</title>
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root{
  --bg:#f8f5ef;        /* 背景（クリーム） */
  --card:#ffffff;      /* カード */
  --sunken:#f3eee6;    /* 入力欄・内側の箱 */
  --line:#e8e1d5;      /* 罫線・バーの土台 */
  --text:#3b3833;      /* 本文 */
  --text2:#6b665e;     /* 補足 */
  --muted:#958f85;     /* 控えめ */
  --faint:#c4bdb1;     /* さらに控えめ */
  --accent:#5f8c74;    /* くすみグリーン */
  --accent-soft:#eaf2ec;
  --warm:#b07b2c;      /* はちみつ色 */
  --warm-soft:#faf1e2;
  --rose:#b86a7e;
  --lavender:#7477b8;
  --teal:#4f8d9c;
  --danger:#b9625a;
  --danger-soft:#fbeeec;
  --on-accent:#ffffff;
  --shadow:0 1px 3px rgba(80,60,30,.06),0 4px 14px rgba(80,60,30,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Maru Gothic ProN','Hiragino Sans','Helvetica Neue',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:60px;-webkit-font-smoothing:antialiased}
input,textarea,button{font-family:inherit}
textarea{resize:none;outline:none}
input{outline:none}
.modal-bg{position:fixed;inset:0;background:rgba(60,50,35,.35);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(60,50,35,.18)}
.modal h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px}
.modal-label{font-size:11px;color:var(--text2);margin-bottom:6px;margin-top:12px;display:block}
.modal-input{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:18px;text-align:center}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-cancel{flex:1;background:var(--sunken);border:none;border-radius:12px;padding:12px;color:var(--text2);cursor:pointer;font-family:inherit}
.modal-save{flex:1;background:var(--accent);border:none;border-radius:12px;padding:12px;color:var(--on-accent);font-weight:700;cursor:pointer;font-family:inherit}
.header{padding:22px 20px 18px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.date-lbl{font-size:14px;color:var(--text);letter-spacing:.5px;font-weight:600}
.hbtns{display:flex;gap:6px}
.hbtn{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap}
.gauge-wrap{position:relative;width:176px;height:176px;margin:0 auto}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-cal{font-size:38px;font-weight:700;line-height:1}
.gauge-rem{font-size:12px;font-weight:600;margin-top:6px}
.gauge-sub{font-size:10px;color:var(--muted);margin-top:4px;text-align:center;line-height:1.5}
.macros{margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px}
.macro-lbl{display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;color:var(--text2)}
.pill{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pill-fill{height:100%;border-radius:99px;transition:width .5s}
.seg-bar{height:8px;background:var(--line);border-radius:99px;display:flex;overflow:hidden;margin-top:14px}
.seg-legend{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.seg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.seg-dot{width:7px;height:7px;border-radius:99px;flex-shrink:0}
.card{margin:10px 14px 0;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card-label{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.fact-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.6}
.fact-body{font-size:13px;color:var(--text2);line-height:1.8;margin-top:6px}
.rice-box{margin:10px 14px 0;background:var(--accent-soft);border-radius:18px;padding:16px;display:none}
.rice-title{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.rice-content{font-size:13px;color:var(--text);line-height:1.8}
.tabs{display:flex;gap:6px;margin:14px 14px 0;padding:4px;background:var(--sunken);border-radius:14px}
.tab-btn{flex:1;border:none;border-radius:11px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.tab-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(80,60,30,.1)}
.tab-btn:not(.active){background:none;color:var(--muted)}
.sections{padding:10px 14px 0}
.meal-sec{background:var(--card);border:1px solid transparent;border-radius:18px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}
.meal-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.meal-info{flex:1}
.meal-title-row{display:flex;align-items:center;gap:8px}
.meal-name{font-size:14px;font-weight:700;color:var(--text)}
.meal-kcal{font-size:13px;font-weight:600}
.meal-cnt{font-size:10px;color:var(--text2);background:var(--sunken);border-radius:99px;padding:1px 8px}
.meal-mini{height:4px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.meal-mini-fill{height:100%;border-radius:99px;transition:width .5s}
.meal-body{border-top:1px solid var(--line);padding:12px 14px}
.quick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.quick-btn{background:var(--warm-soft);border:none;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--warm);cursor:pointer;font-family:inherit}
.entry{background:var(--sunken);border-radius:12px;margin-bottom:6px;overflow:hidden}
.entry-hdr{padding:10px 13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.entry-text{flex:1;min-width:0}
.entry-name{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-nums{display:flex;gap:8px;margin-top:2px;font-size:11px;color:var(--text2)}
.entry-kcal{color:var(--warm);font-weight:600}
.entry-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:2px 6px}
.fav-star{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;color:var(--faint)}
.entry-detail{border-top:1px solid var(--line);padding:11px 13px;display:none}
.entry-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--text2)}
.entry-row{align-items:center;gap:6px}
.entry-row .item-name{flex:1;min-width:0}
.entry-row .item-kcal{color:var(--warm);min-width:62px;text-align:right}
.qty{display:flex;align-items:center;gap:2px;flex-shrink:0}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
.qty-val{min-width:38px;text-align:center;font-size:11px;color:var(--muted)}
.qty-val.changed{color:var(--rose);font-weight:700}
.advice-box{margin-top:8px;padding:9px 11px;background:var(--card);border-radius:10px;font-size:12px;color:var(--text2);line-height:1.7}
.input-box{background:var(--sunken);border-radius:14px;padding:10px 12px;margin-top:6px}
.input-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.input-hint{font-size:10px;color:var(--faint)}
.input-btns{display:flex;gap:6px}
.analyze-btn{border:none;border-radius:11px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit}
.aete-btn{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;color:var(--lavender);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.err-msg{font-size:11px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.5;display:none}
.fav-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fav-chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px}
.fav-chip-kcal{font-size:10px;color:var(--muted)}
.fav-chip-del{color:var(--faint);font-size:11px;cursor:pointer;margin-left:2px}
.w-section{padding:10px 14px 0;display:none}
.w-card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.w-card-title{font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.w-input{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:24px;text-align:center;margin-bottom:10px}
.w-save-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:12px;color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.w-compare{margin-top:10px;text-align:center;font-size:14px;min-height:18px}
.w-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--text2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.summary-share{width:100%;margin-top:12px;background:var(--sunken);border:none;border-radius:12px;padding:10px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13px;padding:10px 16px;border-radius:14px;z-index:200;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(60,50,35,.25);display:none;line-height:1.5}
</style>
</head>
<body>

<!-- API Key Screen -->
<div id="api-screen" style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100">
  <div style="font-size:40px">🔑</div>
  <h2 style="font-size:20px;font-weight:700;color:var(--text);margin:12px 0 8px;text-align:center">APIキーを設定</h2>
  <p style="font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:20px">platform.claude.com で発行した<br>APIキーを貼り付けてください</p>
  <textarea id="api-input" rows="3" style="width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--text);font-size:13px;font-family:monospace;line-height:1.5;outline:none" placeholder="sk-ant-api..."></textarea>
  <button onclick="try{saveApiKey()}catch(e){alert('エラー: '+e.message)}" style="margin-top:14px;width:100%;background:var(--warm);border:none;border-radius:12px;padding:14px;color:var(--on-accent);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">保存して開始</button>
  <p style="font-size:11px;color:var(--faint);margin-top:12px">キーはこの端末のみに保存されます</p>
</div>

<!-- Modals -->
<div id="key-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>APIキーを変更</h3>
    <textarea id="key-modal-input" rows="3" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:12px;font-family:monospace;outline:none;resize:none"></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('key-modal')">キャンセル</button>
      <button class="modal-save" onclick="saveKeyModal()">保存</button>
    </div>
  </div>
</div>

<div id="goal-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>🎯 目標設定</h3>
    <label class="modal-label">1日のカロリーの目安 (kcal)　下限 〜 上限</label>
    <div style="display:flex;align-items:center;gap:8px">
      <input id="goal-min-input" class="modal-input" type="number" inputmode="numeric" placeholder="1550">
      <span style="color:var(--muted)">〜</span>
      <input id="goal-max-input" class="modal-input" type="number" inputmode="numeric" placeholder="1650">
    </div>
    <label class="modal-label">1日のご飯目標 (g)</label>
    <input id="goal-rice-input" class="modal-input" type="number" placeholder="600">
    <label class="modal-label">体重タブのパスワード（任意）</label>
    <input id="goal-pw-input" class="modal-input" type="password" placeholder="空白でパスワードなし">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('goal-modal')">キャンセル</button>
      <button class="modal-save" onclick="saveGoalModal()">保存</button>
    </div>
  </div>
</div>

<div id="pw-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>🔒 体重データ</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">パスワードを入力してください</p>
    <input id="pw-input" type="password" class="modal-input" placeholder="••••" onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pw-error" style="font-size:11px;color:var(--danger);text-align:center;margin-top:8px;display:none">パスワードが違います</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('pw-modal')">キャンセル</button>
      <button class="modal-save" onclick="checkPw()">確認</button>
    </div>
  </div>
</div>

<div id="aete-modal" class="modal-bg" style="display:none">
  <div class="modal" style="max-height:80vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
    <div style="padding:16px 16px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="font-size:16px;font-weight:700;color:var(--text)">🍱 あえて、を選ぶ</h3>
        <button onclick="closeModal('aete-modal')" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
      </div>
      <input id="aete-search" type="text" placeholder="メニューを検索…" oninput="renderAeteList()"
        style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;margin-bottom:8px">
    </div>
    <div id="aete-list" style="overflow-y:auto;flex:1;background:var(--card)"></div>
  </div>
</div>


<div id="toast"></div>

<!-- App -->
<div id="app" style="display:none">
  <div class="header">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:4px">
        <button id="date-prev" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:0 2px" onclick="changeDate(-1)">‹</button>
        <div class="date-lbl" id="date-lbl" style="min-width:92px;text-align:center;white-space:nowrap"></div>
        <button id="date-next" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:0 2px" onclick="changeDate(1)">›</button>
      </div>
      <div class="hbtns">
        <button class="hbtn" onclick="openGoalModal()">🎯 目標</button>
        <button class="hbtn" onclick="openKeyModal()">⚙️ APIキー</button>
      </div>
    </div>
    <div class="gauge-wrap">
      <svg width="176" height="176" style="position:absolute;top:0;left:0">
        <circle cx="88" cy="88" r="76" fill="none" style="stroke:var(--line)" stroke-width="12"/>
        <circle id="gauge-arc" cx="88" cy="88" r="76" fill="none" style="stroke:var(--accent);transition:stroke-dashoffset .8s,stroke .5s" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="477.5"
          transform="rotate(-90 88 88)" style="transition:stroke-dashoffset .8s,stroke .5s"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-cal" id="gauge-cal" style="color:var(--teal)">0</div>
        <div class="gauge-rem" id="gauge-rem" style="color:var(--text2)">残り 1800 kcal</div>
        <div class="gauge-sub" id="gauge-sub">目標 1800 kcal<br>ご飯 600g/日</div>
      </div>
    </div>
    <div class="macros">
      <div>
        <div class="macro-lbl"><span>脂質</span><span id="fat-val">0g</span></div>
        <div class="pill"><div class="pill-fill" id="fat-bar" style="width:0%;background:var(--rose)"></div></div>
      </div>
      <div>
        <div class="macro-lbl"><span>糖質</span><span id="carbs-val">0g</span></div>
        <div class="pill"><div class="pill-fill" id="carbs-bar" style="width:0%;background:var(--lavender)"></div></div>
      </div>
      <div>
        <div class="macro-lbl"><span>タンパク質</span><span id="protein-val">0g</span></div>
        <div class="pill"><div class="pill-fill" id="protein-bar" style="width:0%;background:var(--teal)"></div></div>
      </div>
    </div>
    <div class="seg-bar" id="seg-bar"></div>
    <div class="seg-legend" id="seg-legend"></div>
  </div>

  <div class="card" id="fact-card"></div>

  <div class="rice-box" id="rice-box">
    <div class="rice-title">🍚 夕食のご飯量アドバイス</div>
    <div class="rice-content" id="rice-content"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-food" onclick="showTab('food')">🍽️ 食事</button>
    <button class="tab-btn" id="tab-weight" onclick="showTab('weight')">⚖️ 体重</button>
  </div>

  <div class="sections" id="sections"></div>

  <div class="w-section" id="w-section">
    <div class="w-card">
      <div class="w-card-title">今日の体重</div>
      <input id="w-input" class="w-input" type="number" step="0.1" placeholder="00.0">
      <button class="w-save-btn" onclick="saveWeight()">記録する</button>
      <div class="w-compare" id="w-compare"></div>
    </div>
    <div class="w-card">
      <div class="w-card-title">目標体重</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="goal-weight-input" type="number" step="0.1" placeholder="例: 55.0"
          style="flex:1;min-width:0;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);font-size:20px;text-align:center;outline:none">
        <span style="color:var(--muted);font-size:14px">kg</span>
        <button onclick="saveGoalWeight()" style="flex-shrink:0;white-space:nowrap;background:var(--accent);border:none;border-radius:12px;padding:10px 16px;color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">保存</button>
      </div>
    </div>
    <div class="w-card">
      <div class="w-card-title">体重推移（14日）</div>
      <canvas id="w-chart" style="width:100%;height:160px;display:block"></canvas>
      <div id="w-list" style="margin-top:12px"></div>
    </div>
  </div>
  <div id="monthly-report" style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 14px"></div>

</div>

<script>
const AETE_DB = [
  {id:1, name:"山椒香るぶりの塩焼き、生姜鶏そぼろまぜご飯", calories:455, protein:23, fat:14, carbs:63, sugar:56},
  {id:2, name:"トマト生姜焼き、枝豆と干しえびのまぜご飯", calories:454, protein:24, fat:17, carbs:55, sugar:47},
  {id:3, name:"ギョーザ、枝豆と干しえびのまぜご飯", calories:464, protein:24, fat:18, carbs:55, sugar:48},
  {id:4, name:"若鶏の香ばし醤油焼き、鮭ときのこのまぜご飯", calories:469, protein:20, fat:16, carbs:66, sugar:57},
  {id:8, name:"香味だれ油淋鶏と彩り野菜、たけのこと蓮根のまぜご飯", calories:533, protein:19, fat:25, carbs:61, sugar:55},

function load() {
  try {
    apiKey      = localStorage.getItem('c_apikey') || '';
    goalCal     = parseInt(localStorage.getItem('c_goalcal')) || 1800;
    goalMin     = parseInt(localStorage.getItem('c_goalcal_min')) || goalCal - 50;
    goalMax     = parseInt(localStorage.getItem('c_goalcal_max')) || goalCal + 50;
    goalCal     = Math.round((goalMin + goalMax) / 2);
    goalRice    = parseInt(localStorage.getItem('c_goalrice')) || 600;
    weightPw    = localStorage.getItem('c_weightpw') || '';
    weightData  = JSON.parse(localStorage.getItem('c_weight') || '{}');
    favorites   = JSON.parse(localStorage.getItem('c_favs') || '[]');
    goalWeight  = parseFloat(localStorage.getItem('c_goalweight')) || 0;
  } catch(e) {}
}
function loadMealData() {
  try {
    const saved = localStorage.getItem('c_meals_' + currentDate);
    mealData = saved ? JSON.parse(saved) : {morning:[], lunch:[], snack:[], dinner:[]};
  } catch(e) {
    mealData = {morning:[], lunch:[], snack:[], dinner:[]};
  }
}
function saveMealData() {
  save('c_meals_' + currentDate, mealData);
}
function changeDate(delta) {
  const parts = currentDate.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  d.setDate(d.getDate() + delta);
  const y = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  const newDate = y+'-'+mo+'-'+da;
  if (newDate > todayStr()) return;
  currentDate = newDate;
  loadMealData();
  updateDateLabel();
  renderAll();
}
function updateDateLabel() {
  const today = todayStr();
  const parts = currentDate.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  const label = d.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  const isToday = currentDate === today;
  document.getElementById('date-lbl').textContent = label;
  const nextBtn = document.getElementById('date-next');
  if (nextBtn) {
    nextBtn.style.opacity = isToday ? '0.2' : '1';
  }
}
function save(key, val) { try { localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val)); } catch(e) {} }

function saveGoalModal() {
  let lo = parseInt(document.getElementById('goal-min-input').value);
  let hi = parseInt(document.getElementById('goal-max-input').value);
  const r = parseInt(document.getElementById('goal-rice-input').value);
  const pw = document.getElementById('goal-pw-input').value;
  const gw = parseFloat(document.getElementById('goal-weight-input').value);
  if (lo > 0 || hi > 0) {
    lo = lo > 0 ? lo : hi; hi = hi > 0 ? hi : lo;
    if (lo > hi) [lo, hi] = [hi, lo];
    goalMin = lo; goalMax = hi; goalCal = Math.round((lo + hi) / 2);
    save('c_goalcal_min', lo); save('c_goalcal_max', hi); save('c_goalcal', goalCal);
  }
  if (r > 0) { goalRice = r; save('c_goalrice', r); }
  if (gw > 0) { goalWeight = gw; save('c_goalweight', gw); }
  weightPw = pw;
  weightUnlocked = false;
  save('c_weightpw', pw);
  renderAll();
  renderWeightSection();
  closeModal('goal-modal');
}

  const v = document.getElementById('pw-input').value;

function getTotals(keys) {
  return (keys || ['morning','lunch','snack','dinner']).reduce((a, k) => {
    (mealData[k]||[]).forEach(e => {
      a.calories += e.total?.calories || 0;
      a.fat      += e.total?.fat      || 0;
      a.carbs    += e.total?.carbs    || 0;
      a.protein  += e.total?.protein  || 0;
    });
    return a;
  }, {calories:0, fat:0, carbs:0, protein:0});
}

//
function renderGauge(t) {
  const pct = Math.min(1, t.calories / goalMax);
  const over = t.calories > goalMax;
  const color = over ? 'var(--lavender)' : 'var(--accent)';
  const arc = document.getElementById('gauge-arc');
  arc.style.strokeDashoffset = 2 * Math.PI * 76 * (1 - pct);
  arc.style.stroke = color;
  const calEl = document.getElementById('gauge-cal');
  calEl.textContent = t.calories;
  calEl.style.color = color;
  const remEl = document.getElementById('gauge-rem');
  remEl.textContent = over ? `上限から +${t.calories - goalMax} kcal` : `上限まで ${goalMax - t.calories} kcal`;
  remEl.style.color = 'var(--text2)';
  document.getElementById('gauge-sub').innerHTML = `目安 ${goalMin}〜${goalMax} kcal<br>ご飯 ${goalRice}g/日`;
}

//
// PFC の目安（タンパク質20%・脂質27%・糖質53%）
function macroGuide() {
  return {
    protein: Math.round(goalCal * 0.20 / 4),
    fat:     Math.round(goalCal * 0.27 / 9),
    carbs:   Math.round(goalCal * 0.53 / 4),
  };
}
function renderMacros(t) {
  const G = macroGuide();
  ['fat','carbs','protein'].forEach(k => {
    document.getElementById(k+'-val').textContent = `${t[k]} / ${G[k]}g`;
    document.getElementById(k+'-bar').style.width = Math.min(100, t[k]/G[k]*100) + '%';
  });
}

function renderSeg() {
  const bar = document.getElementById('seg-bar');
  const legend = document.getElementById('seg-legend');
  bar.innerHTML = ''; legend.innerHTML = '';
  MEALS.forEach(m => {
    const cal = (mealData[m.key]||[]).reduce((s,e)=>s+(e.total?.calories||0),0);
    const d = document.createElement('div');
    d.style.cssText = `width:${Math.min(100,cal/goalMax*100)}%;background:${m.color};transition:width .5s`;
    bar.appendChild(d);
    const item = document.createElement('div');
    item.className = 'seg-item';
    item.innerHTML = `<div class="seg-dot" style="background:${m.color}"></div>${m.label}<span style="color:${cal>0?m.color:'var(--faint)'}">${cal>0?cal:'—'}</span>`;
    legend.appendChild(item);
  });
}

function renderRice() {
  const box = document.getElementById('rice-box');
  const cnt = document.getElementById('rice-content');
  const sf = getTotals(['morning','lunch','snack']);
  if (!sf.calories) { box.style.display='none'; return; }
  box.style.display = 'block';
  if ((mealData.dinner||[]).length > 0) {
    // Hide rice box when summary is shown
    box.style.display = 'none';
    return;
  }
  const totalCarbsAsRice = Math.round(sf.carbs / 37 * 100);
  const remCal = Math.max(0, goalCal - sf.calories);
  // ご飯は糖質の目安で決め、残りカロリーの半分（残り半分はおかず）を超えないようにする
  const riceByCal = Math.floor(remCal * 0.5 / 1.68 / 10) * 10;
  const riceRem = Math.min(Math.max(0, goalRice - totalCarbsAsRice), riceByCal);
  const riceKcal = Math.round(riceRem * 1.68);
  const bowl = riceRem >= 250 ? '大盛り' : riceRem >= 180 ? '普通盛り' : riceRem >= 120 ? '小盛り' : riceRem >= 60 ? '少量' : 'なし';
  cnt.innerHTML = riceRem <= 0
    ? `夕食は <span style="color:var(--warm);font-weight:700">ご飯なし</span> でおかず中心に。目安の中央まで残り ${remCal} kcal。`
    : `糖質合計 ${sf.carbs}g → ご飯換算 ${totalCarbsAsRice}g（目標 ${goalRice}g）<br>🍚 夕食のご飯 <span style="color:var(--accent);font-weight:700;font-size:17px">${riceRem}g（${bowl}）</span><br><span style="font-size:12px;color:var(--muted)">ご飯で ${riceKcal} kcal・おかずで残り ${remCal - riceKcal} kcal</span>`;
}

// 品目ごとの量を倍率で調整（0 = なし）。元の値は base / baseTotal に残す
const NUTRIENTS = ['calories','fat','carbs','protein'];
function scaleAmount(amount, r) {
  const m = String(amount || '').match(/(\d+(?:\.\d+)?)\s*g/);
  if (m) return amount.replace(m[0], Math.round(parseFloat(m[1]) * r) + 'g');
  return r === 1 ? amount : `${amount} ×${r}`;
}
function adjustItem(key, i, j, delta) {
  const e = mealData[key][i];
  const f = e && (e.meals || [])[j];
  if (!f) return;
  if (!f.base) f.base = {amount: f.amount, ...Object.fromEntries(NUTRIENTS.map(n => [n, f[n] || 0]))};
  if (!e.baseTotal) e.baseTotal = Object.fromEntries(NUTRIENTS.map(n => [n, e.total?.[n] || 0]));
  const r = Math.min(3, Math.max(0, Math.round(((f.ratio ?? 1) + delta) * 100) / 100));
  f.ratio = r;
  NUTRIENTS.forEach(n => { f[n] = Math.round(f.base[n] * r); });
  f.amount = scaleAmount(f.base.amount, r);
  // 合計 = 元の合計 + 調整した品目の差分（AIの合計と品目の和がずれていても崩れないように）
  e.total = Object.fromEntries(NUTRIENTS.map(n => [n, Math.max(0,
    e.baseTotal[n] + e.meals.reduce((s, x) => s + (x.base ? (x[n] || 0) - x.base[n] : 0), 0))]));
  detailOpen[e.id] = true;
  saveMealData();
  renderAll();
}
function deleteEntry(key, i) { mealData[key].splice(i, 1); saveMealData(); renderAll(); }

function toggleFav(key, i) {

async function analyze(mealKey) {
  const ta = document.getElementById(`ta-${mealKey}`);
  const btn = document.getElementById(`btn-${mealKey}`);
  const err = document.getElementById(`err-${mealKey}`);
  const text = ta.value.trim();
  if (!text) return;
  const color = MEALS.find(m=>m.key===mealKey).color;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 解析中…';
  btn.style.background = 'var(--line)'; btn.style.color = 'var(--muted)';
  err.style.display = 'none';
  try {
    const res = await fetch('/api/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, apiKey}),
    });
    const parsed = await res.json();
    if (!res.ok) throw new Error(parsed.error || 'HTTP ' + res.status);
    ta.value = '';
    addEntry(mealKey, {input:text, ...parsed, id:Date.now()});
  } catch(e) {
    err.textContent = '⚠️ ' + e.message;
    err.style.display = 'block';
  }
  btn.disabled = false; btn.innerHTML = '解析する';
  btn.style.background = color; btn.style.color = 'var(--on-accent)';
}

function drawChart() {
  const canvas = document.getElementById('w-chart');
  if (!canvas) return;
  const W = canvas.offsetWidth||320, H = 160, dpr = window.devicePixelRatio||1;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {line: css('--line'), faint: css('--muted'), main: css('--lavender'), goal: css('--accent'), card: css('--card')};
  ctx.scale(dpr, dpr);
  const days = Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.toISOString().slice(0,10);});
  const vals = days.map(d=>weightData[d]||null);
  const valid = vals.filter(v=>v!==null);
  if (!valid.length) { ctx.fillStyle=C.faint;ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('データがありません',W/2,H/2);return; }
  const minV=Math.min(...valid)-1, maxV=Math.max(...valid)+1;
  const pad={t:14,b:22,l:30,r:10}, gW=W-pad.l-pad.r, gH=H-pad.t-pad.b;
  const xS=i=>pad.l+i/13*gW, yS=v=>pad.t+gH-(v-minV)/(maxV-minV)*gH;
  ctx.strokeStyle=C.line;ctx.lineWidth=1;
  [0,1,2,3].forEach(i=>{const y=pad.t+i/3*gH;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle=C.faint;ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText((maxV-i/3*(maxV-minV)).toFixed(1),pad.l-3,y+3);});
  days.forEach((d,i)=>{if(i%2===0){const dd=new Date(d+'T00:00:00');ctx.fillStyle=C.faint;ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,xS(i),H-4);}});
  const pts=vals.map((v,i)=>v!==null?{x:xS(i),y:yS(v)}:null).filter(Boolean);
  if (!pts.length) return;
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H-pad.b);ctx.lineTo(pts[0].x,H-pad.b);ctx.closePath();
  ctx.fillStyle='rgba(116,119,184,0.12)';ctx.fill();
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=C.main;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  // Goal weight line
  if (goalWeight && goalWeight >= minV && goalWeight <= maxV) {
    const gy = yS(goalWeight);
    ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);
    ctx.strokeStyle=C.goal;ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.goal;ctx.font='9px sans-serif';ctx.textAlign='left';
    ctx.fillText('目標 '+goalWeight+'kg',pad.l+2,gy-3);
  }
  const today=todayStr();
  vals.forEach((v,i)=>{if(!v)return;const isT=days[i]===today;ctx.beginPath();ctx.arc(xS(i),yS(v),isT?5:3,0,Math.PI*2);ctx.fillStyle=C.main;ctx.fill();if(isT){ctx.beginPath();ctx.arc(xS(i),yS(v),5,0,Math.PI*2);ctx.strokeStyle=C.card;ctx.lineWidth=1.5;ctx.stroke();}});
}

function dayCalories(ds) {
  try {
    const md = JSON.parse(localStorage.getItem('c_meals_' + ds) || 'null');
    if (!md) return 0;
    return MEALS.reduce((s, m) => s + (md[m.key]||[]).reduce((a, e) => a + (e.total?.calories || 0), 0), 0);
  } catch(e) { return 0; }
}
function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// 直近 days 日のうち、記録のある日の平均
function avgCalories(endOffset, days) {
  let sum = 0, n = 0;
  for (let i = endOffset; i < endOffset + days; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const c = dayCalories(dateStr(d));
    if (c > 0) { sum += c; n++; }
  }
  return {avg: n ? Math.round(sum / n) : 0, n};
}

  {t:'果物の甘さは、血糖値を上げにくいものもある', b:'果物に多い果糖は、ブドウ糖と違って血糖値をほとんど上げません。肝臓で処理されるためです。'},

  {t:'お腹のガスは、腸内細菌が働いたしるし', b:'腸内細菌が食物繊維を分解すると、副産物としてガスが出ます。食物繊維を増やした時期にガスが増えるのは、そのためです。'},
  {t:'自律神経は、シーソーのように入れ替わる', b:'活動の交感神経と、休息の副交感神経。どちらが良い・悪いではなく、1日の中で交互に優位になるのが普通の動き方です。'},

function renderFact() {
  const el = document.getElementById('fact-card');
  if (!el) return;
  const d = new Date();
  const dayNum = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const f = FACTS[dayNum % FACTS.length];
  el.innerHTML = `
    <div class="card-label">🌱 今日の仕組み</div>
    <div class="fact-title">${f.t}</div>
    <div class="fact-body">${f.b}</div>`;
}

function startApp() {
  renderFact();
  currentDate = todayStr();
  loadMealData();
  updateDateLabel();
  renderAll();
}

//
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({text}); return; }
    catch(e) { if (e.name === 'AbortError') return; }
  }
  window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
}

function yesterdayEntries(key) {
  const p = currentDate.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate() - 1);
  try { return (JSON.parse(localStorage.getItem('c_meals_' + dateStr(d)) || 'null') || {})[key] || []; }
  catch(e) { return []; }
}
function copyYesterday(key) {
  const src = yesterdayEntries(key);
  if (!src.length) return;
  const now = Date.now();
  src.forEach((e, i) => mealData[key].push({...e, id: now + i}));
  saveMealData();
  renderAll();
  showToast(`昨日の${MEALS.find(m => m.key === key).label}（${src.length}件）を追加しました`);
}

function addEntry(key, entry) {
  mealData[key].push(entry);
  saveMealData();
  renderAll();
}

function shareSummary() {
  const t = getTotals();
  const lines = [`📊 ${document.getElementById('date-lbl').textContent}の記録`];
  MEALS.forEach(m => {
    const cal = (mealData[m.key]||[]).reduce((s,e)=>s+(e.total?.calories||0),0);
    const names = (mealData[m.key]||[]).map(e => e.input).join('、');
    lines.push(`${m.emoji}${m.label} ${cal ? cal + 'kcal' : '—'}${names ? '（' + (names.length > 30 ? names.slice(0,30) + '…' : names) + '）' : ''}`);
  });
  lines.push(`合計 ${t.calories} kcal（目安 ${goalMin}〜${goalMax} kcal）`);
  lines.push(`P ${t.protein}g・F ${t.fat}g・C ${t.carbs}g`);
  shareText(lines.join('\n'));
}

load();
if (apiKey) {
  document.getElementById('api-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  startApp();
}

</script>
